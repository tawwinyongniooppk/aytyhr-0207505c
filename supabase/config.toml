# Cron-invoked functions authenticate internally via CRON_SECRET (or service-role).
# verify_jwt must be false so the gateway does not reject the Bearer <CRON_SECRET>
# header (it is not a JWT). Anonymous probes are rejected inside the function.
[functions.auto-submit-missed-leave]
verify_jwt = false

[functions.auto-checkout]
verify_jwt = false

[functions.auto-weekly-task-credit]
verify_jwt = false

[functions.task-deadline-sweep]
verify_jwt = false

[functions.monthly-reset]
verify_jwt = false
